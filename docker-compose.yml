services:
    spotify-node:
        image: node:20
        user: node
        working_dir: /home/node/app
        environment:
            - NODE_ENV=development
            - FRONTEND_URL=http://127.0.0.1:5173
        volumes:
            - ./:/home/node/app:cached
        ports:
            - "3000:3000"
        command: >
            sh -c "cd backend &&
                   npm install &&
                   npm run dev"
        restart: always
        stdin_open: true
        tty: true
        depends_on:
            - spotify-mongo

    spotify-frontend:
        image: node:20
        user: node
        working_dir: /home/node/app
        environment:
            - NODE_ENV=development
            - VITE_API_BASE_URL=
            - VITE_BACKEND_ORIGIN=http://127.0.0.1:3000
            - API_PROXY_TARGET=http://spotify-node:3000
        volumes:
            - ./frontend:/home/node/app:cached
        ports:
            - "5173:5173"
        command: >
            sh -c "npm install &&
                   npm run dev -- --host 0.0.0.0 --port 5173"
        restart: always
        stdin_open: true
        tty: true
        depends_on:
            - spotify-node

    spotify-mongo:
        image: mongo:7
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - spotify-mongo-data:/data/db

volumes:
    spotify-mongo-data:

networks:
    default:
        name: spotify-prototype
